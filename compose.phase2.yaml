x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__API__EXPOSE_CONFIG: "non-sensitive-only"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"

    AIRFLOW__API_AUTH__JWT_SECRET: "put-a-long-random-jwt-secret-here"
    AIRFLOW__API__SECRET_KEY: "put-a-long-random-api-secret-here"

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"

    PIPELINE_REPO_ROOT: /workspace/rltm_bi_pltfrm
    S3_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

    AWS_REGION: us-east-1

    PYSPARK_PYTHON: /usr/local/bin/python
    PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
    SPARK_SUBMIT: /home/airflow/.local/bin/spark-submit
    SPARK_MASTER_URL: spark://spark-master:7077

    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    EVENT_TOPIC: user_events

    
  volumes:
    - ./:/workspace/rltm_bi_pltfrm
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
  networks:
    - rltm_shared_net


  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    networks:
      - rltm_shared_net


  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >
      -c "
      set -e &&
      mkdir -p /opt/airflow/dags /opt/airflow/logs /opt/airflow/config /opt/airflow/plugins &&
      airflow db migrate
      "

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-api-server:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-api-server:
        condition: service_healthy

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-api-server:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - rltm_shared_net

  collector:
    build:
      context: ./apps/collector
      dockerfile: Dockerfile
    container_name: collector
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: user_events
      STORAGE_FILE: /data/events.jsonl
      ENABLE_FILE_FALLBACK: "true"
      ALLOWED_ORIGINS: "http://localhost:8091,http://127.0.0.1:8091"
    volumes:
      - ./data/collector:/data
    depends_on:
      - kafka
    networks:
      - rltm_shared_net


  spark-bronze-ingest:
    image: apache/spark:3.5.1-python3
    container_name: spark-bronze-ingest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EVENT_TOPIC: user_events

      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1

      BRONZE_PATH: s3a://lakehouse/bronze_delta/user_events
      CHECKPOINT_PATH: /tmp/checkpoints/kafka_to_bronze_user_events_delta

      TRIGGER_INTERVAL: 15 seconds
      STARTING_OFFSETS: latest
      FAIL_ON_DATA_LOSS: "false"

      HEARTBEAT_FILE: /tmp/health/bronze_heartbeat.txt
      HEARTBEAT_MAX_AGE_SEC: "90"

    command: >
      bash -lc "
      mkdir -p /tmp/.ivy2/cache /tmp/.ivy2/jars /tmp/checkpoints/kafka_to_bronze_user_events_delta /tmp/health &&
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.hadoop:hadoop-aws:3.3.4
      /opt/spark/apps/kafka_to_bronze.py
      "
    volumes:
      - ./spark_apps:/opt/spark/apps
      - ./spark_checkpoints/kafka_to_bronze_user_events_delta:/tmp/checkpoints/kafka_to_bronze_user_events_delta
      - ./spark_ivy:/tmp/.ivy2
      - ./spark_health:/tmp/health
    depends_on:
      - kafka
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nfrom pathlib import Path\nimport os, time, sys\np = Path(os.environ.get('HEARTBEAT_FILE', '/tmp/health/bronze_heartbeat.txt'))\nmax_age = int(os.environ.get('HEARTBEAT_MAX_AGE_SEC', '90'))\nif not p.exists():\n    sys.exit(1)\nage = time.time() - p.stat().st_mtime\nsys.exit(0 if age <= max_age else 1)\nPY"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - rltm_shared_net

volumes:
  airflow-postgres-data:

networks:
  rltm_shared_net:
    external: true