# Phase 1 compose — core lakehouse
services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../minio_data:/data
    networks:
      - rltm_shared_net

  postgres-warehouse:
    image: postgres:16
    container_name: postgres-warehouse
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_warehouse_data:/var/lib/postgresql/data
    networks:
      - rltm_shared_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres-warehouse
    networks:
      - rltm_shared_net

  spark-master:
    image: apache/spark:3.5.1-python3
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ../jars:/opt/spark/jars-extra
      - ../spark_apps:/opt/spark/apps
    networks:
      - rltm_shared_net

  spark-worker:
    image: apache/spark:3.5.1-python3
    container_name: spark-worker
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2G"
    ports:
      - "8081:8081"
    volumes:
      - ../jars:/opt/spark/jars-extra
      - ../spark_apps:/opt/spark/apps
    networks:
      - rltm_shared_net

  jupyter:
    build:
      context: ..
      dockerfile: docker/jupyter/Dockerfile
    container_name: jupyter
    depends_on:
      - spark-master
      - minio
      - postgres-warehouse
    environment:
      SPARK_MASTER: spark://spark-master:7077
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    ports:
      - "8888:8888"
    volumes:
      - ../:/workspace/rltm_bi_pltfrm
      - ../jars:/opt/spark/jars-extra
    networks:
      - rltm_shared_net

volumes:
  postgres_warehouse_data:

networks:
  rltm_shared_net:
    external: true