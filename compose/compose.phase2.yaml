x-airflow-common: &airflow-common
  image: ${RLTM_AIRFLOW_IMAGE}
  build:
    context: ${PROJECT_ROOT}
    dockerfile: docker/airflow/Dockerfile
    args:
      AIRFLOW_BASE_IMAGE: ${RLTM_AIRFLOW_BASE_IMAGE}
  env_file:
    - ${PROJECT_ROOT}/.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__API__EXPOSE_CONFIG: "non-sensitive-only"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:${AIRFLOW_ADMIN_PASSWORD}"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"

    SPARK_SUBMIT: /home/airflow/.local/bin/spark-submit
    SPARK_MASTER_URL: ${SPARK_MASTER_URL}
    PIPELINE_REPO_ROOT: /workspace/rltm_bi_pltfrm
    PYTHONPATH: /workspace/rltm_bi_pltfrm

    S3_ENDPOINT: ${S3_ENDPOINT}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_REGION: ${AWS_REGION}
  volumes:
    - ${PROJECT_ROOT}:/workspace/rltm_bi_pltfrm
    - ${PROJECT_ROOT}/airflow/dags:/opt/airflow/dags
    - ${PROJECT_ROOT}/airflow/lib:/opt/airflow/lib
    - ${PROJECT_ROOT}/airflow/logs:/opt/airflow/logs
    - ${PROJECT_ROOT}/airflow/config:/opt/airflow/config
    - ${PROJECT_ROOT}/airflow/plugins:/opt/airflow/plugins
    - ${PROJECT_ROOT}/airflow/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
  depends_on:
    airflow-postgres:
      condition: service_healthy
  networks:
    - rltm_shared_net

x-spark-stream-base: &spark-stream-base
  image: ${RLTM_SPARK_IMAGE}
  env_file:
    - ${PROJECT_ROOT}/.env
  environment:
    PIPELINE_REPO_ROOT: /workspace/rltm_bi_pltfrm
    PYTHONPATH: /workspace/rltm_bi_pltfrm
    SPARK_SUBMIT: /opt/spark/bin/spark-submit
    SPARK_MASTER_URL: ${SPARK_MASTER_URL}
    S3_ENDPOINT: ${S3_ENDPOINT}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_REGION: ${AWS_REGION}
  volumes:
    - ${PROJECT_ROOT}:/workspace/rltm_bi_pltfrm
    - ${PROJECT_ROOT}/spark_ivy:/tmp/.ivy2
    - ${PROJECT_ROOT}/spark_health:/tmp/health
    - ${PROJECT_ROOT}/spark_checkpoints:/tmp/checkpoints
  depends_on:
    - spark-master
    - spark-worker
    - spark-worker-2
    - kafka
  restart: unless-stopped
  stop_grace_period: 30s
  networks:
    - rltm_shared_net

services:
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - rltm_shared_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >
      -lc "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USER}
      --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname ${AIRFLOW_ADMIN_FIRSTNAME}
      --lastname ${AIRFLOW_ADMIN_LASTNAME}
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL} || true
      "

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - rltm_shared_net

  collector:
    image: ${RLTM_COLLECTOR_IMAGE}
    build:
      context: ${PROJECT_ROOT}/apps/collector
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${RLTM_PYTHON_BASE_IMAGE}
    container_name: collector
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      STORAGE_FILE: /data/events.jsonl
      ENABLE_FILE_FALLBACK: "true"
      ALLOWED_ORIGINS: ${COLLECTOR_ALLOWED_ORIGINS}
    volumes:
      - ${PROJECT_ROOT}/data/collector:/data
    depends_on:
      - kafka
    networks:
      - rltm_shared_net

  kafka-init-topics:
    image: apache/kafka:3.9.2
    container_name: kafka-init-topics
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --create --if-not-exists --topic ${KAFKA_TOPIC} --partitions ${KAFKA_TOPIC_PARTITIONS} --replication-factor ${KAFKA_TOPIC_REPLICATION_FACTOR} &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --describe --topic ${KAFKA_TOPIC}
      "
    networks:
      - rltm_shared_net

  spark-stream-supervisor:
    <<: *spark-stream-base
    container_name: spark-stream-supervisor
    depends_on:
      - spark-master
      - spark-worker
      - spark-worker-2
      - kafka
      - kafka-init-topics
    user: "0:0"
    environment:
      STREAM_LOG_DIR: /tmp/health/logs
      PYTHONPATH: /workspace/rltm_bi_pltfrm
      JOB_RUN_REGISTRY_FILE: /workspace/rltm_bi_pltfrm/runtime/job_runs/job_runs.jsonl
      PIPELINE_REPO_ROOT: /workspace/rltm_bi_pltfrm
      SPARK_SUBMIT: /opt/spark/bin/spark-submit
      SPARK_MASTER_URL: ${SPARK_MASTER_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    command: >
      bash -lc "
      mkdir -p /tmp/.ivy2/cache /tmp/.ivy2/jars /tmp/checkpoints /tmp/health &&
      python3 /workspace/rltm_bi_pltfrm/streaming/runners/stream_supervisor.py
      --registry /workspace/rltm_bi_pltfrm/configs/streaming/stream_registry.json
      --status-file /tmp/health/stream_supervisor_status.json
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 - <<'PY'\nfrom pathlib import Path\nimport json, sys, time\nstatus_p = Path('/tmp/health/stream_supervisor_status.json')\nif not status_p.exists():\n    sys.exit(1)\nif time.time() - status_p.stat().st_mtime > 120:\n    sys.exit(1)\ndata = json.loads(status_p.read_text(encoding='utf-8'))\nunits = data.get('units', {})\nif not units:\n    sys.exit(1)\nfor name, u in units.items():\n    if not u.get('enabled', True):\n        continue\n    if u.get('pid') is None:\n        sys.exit(1)\n    if u.get('returncode') is not None:\n        sys.exit(1)\n    hb = u.get('heartbeat') or {}\n    if hb.get('status') == 'error':\n        sys.exit(1)\nsys.exit(0)\nPY"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  airflow_postgres_data:

networks:
  rltm_shared_net:
    external: true