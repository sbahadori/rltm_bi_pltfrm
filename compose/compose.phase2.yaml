x-airflow-common: &airflow-common
  build:
    context: ${PROJECT_ROOT}
    dockerfile: docker/airflow/Dockerfile
  env_file:
    - ${PROJECT_ROOT}/.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__API__EXPOSE_CONFIG: "non-sensitive-only"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: "put-a-long-random-jwt-secret-here"
    AIRFLOW__API__SECRET_KEY: "put-a-long-random-api-secret-here"

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"

    PIPELINE_REPO_ROOT: /workspace/rltm_bi_pltfrm
    S3_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    AWS_REGION: us-east-1
  volumes:
    - ${PROJECT_ROOT}:/workspace/rltm_bi_pltfrm
    - ${PROJECT_ROOT}/airflow/dags:/opt/airflow/dags
    - ${PROJECT_ROOT}/airflow/lib:/opt/airflow/lib
    - ${PROJECT_ROOT}/airflow/logs:/opt/airflow/logs
    - ${PROJECT_ROOT}/airflow/config:/opt/airflow/config
    - ${PROJECT_ROOT}/airflow/plugins:/opt/airflow/plugins
    - ${PROJECT_ROOT}/airflow/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
  depends_on:
    airflow-postgres:
      condition: service_healthy
  networks:
    - rltm_shared_net

x-spark-stream-base: &spark-stream-base
  build:
    context: ${PROJECT_ROOT}
    dockerfile: docker/spark/Dockerfile
  env_file:
    - ${PROJECT_ROOT}/.env
  environment:
    PIPELINE_REPO_ROOT: /workspace/rltm_bi_pltfrm
    SPARK_SUBMIT: /opt/spark/bin/spark-submit
    SPARK_MASTER_URL: spark://spark-master:7077
    S3_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: "put-a-long-random-jwt-secret-here"
    AIRFLOW__API__SECRET_KEY: "put-a-long-random-api-secret-here"

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"




    AWS_REGION: us-east-1
  volumes:
    - ${PROJECT_ROOT}:/workspace/rltm_bi_pltfrm
    - ${PROJECT_ROOT}/spark_apps:/opt/spark/apps
    - ${PROJECT_ROOT}/spark_ivy:/tmp/.ivy2
    - ${PROJECT_ROOT}/spark_health:/tmp/health
    - ${PROJECT_ROOT}/spark_checkpoints:/tmp/checkpoints
  depends_on:
    - spark-master
    - spark-worker
    - spark-worker-2
    - kafka
  restart: unless-stopped
  stop_grace_period: 30s
  networks:
    - rltm_shared_net


services:
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - rltm_shared_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >
      -lc "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true
      "

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - rltm_shared_net

  collector:
    build:
      context: ${PROJECT_ROOT}/apps/collector
      dockerfile: Dockerfile
    container_name: collector
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: user_events
      STORAGE_FILE: /data/events.jsonl
      ENABLE_FILE_FALLBACK: "true"
      ALLOWED_ORIGINS: "http://localhost:8091,http://127.0.0.1:8091"
    volumes:
      - ${PROJECT_ROOT}/data/collector:/data
    depends_on:
      - kafka
    networks:
      - rltm_shared_net


  spark-stream-supervisor:
    <<: *spark-stream-base
    container_name: spark-stream-supervisor
    command: >
      bash -lc "
      mkdir -p /tmp/.ivy2/cache /tmp/.ivy2/jars /tmp/checkpoints /tmp/health &&
      python3 /opt/spark/apps/runners/stream_supervisor.py
      --registry configs/streaming/stream_registry.yaml
      --status-file /tmp/health/stream_supervisor_status.json
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 - <<'PY'\nfrom pathlib import Path\nimport json, sys, time\np = Path('/tmp/health/stream_supervisor_status.json')\nif not p.exists():\n    sys.exit(1)\ndata = json.loads(p.read_text(encoding='utf-8'))\nif not data.get('streams'):\n    sys.exit(1)\nif time.time() - p.stat().st_mtime > 120:\n    sys.exit(1)\nsys.exit(0)\nPY"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  airflow_postgres_data:

networks:
  rltm_shared_net:
    external: true