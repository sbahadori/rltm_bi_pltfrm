services:
  web:
    build:
      context: ${PROJECT_ROOT}/apps/web
      dockerfile: Dockerfile
    container_name: web
    ports:
      - "8091:8080"
    environment:
      COLLECTOR_URL: http://collector:8000/collect
      PUBLIC_COLLECTOR_URL: http://localhost:8000/collect
    networks:
      - rltm_shared_net

  dashboard-api:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: docker/dashboard/Dockerfile
    container_name: dashboard-api
    restart: unless-stopped
    env_file:
      - ${PROJECT_ROOT}/.env
    environment:
      PIPELINE_REPO_ROOT: /workspace/rltm_bi_pltfrm
    volumes:
      - ${PROJECT_ROOT}:/workspace/rltm_bi_pltfrm:ro
    networks:
      - rltm_shared_net

  dashboard:
    image: nginx:alpine
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "9090:80"
    volumes:
      - ${PROJECT_ROOT}/apps/dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ${PROJECT_ROOT}/apps/dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dashboard-api
    networks:
      - rltm_shared_net

networks:
  rltm_shared_net:
    external: true


# داشبورد روی:
# http://localhost:9090
# فروشگاه دمو روی:
# http://localhost:8091
