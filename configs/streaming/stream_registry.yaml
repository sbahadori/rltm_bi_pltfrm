streams:
  - name: clickstream_user_events
    enabled: true

    source:
      type: kafka
      bootstrap_servers: kafka:19092
      topic: user_events
      starting_offsets: latest
      fail_on_data_loss: false

    bronze:
      engine: generic_kafka_to_bronze
      app_name: bronze_clickstream_user_events
      path: s3a://lakehouse/bronze_delta/user_events
      checkpoint_dir: /tmp/checkpoints/bronze_clickstream_user_events
      heartbeat_file: /tmp/health/bronze_clickstream_user_events.json
      trigger_interval: 15 seconds
      partition_by:
        - event_date

      derived_fields:
        event_type:
          kind: json
          path: $.event_type
        anonymous_id:
          kind: json
          path: $.anonymous_id
        session_id:
          kind: json
          path: $.session_id
        event_ts:
          kind: json_timestamp
          path: $.event_ts
        event_date:
          kind: sql
          expr: "coalesce(to_date(event_ts), to_date(kafka_timestamp))"

    silver:
      engine: generic_bronze_to_silver
      app_name: silver_clickstream_user_events
      bronze_path: s3a://lakehouse/bronze_delta/user_events
      path: s3a://lakehouse/silver_delta/user_events_clean
      quarantine_path: s3a://lakehouse/silver_delta/user_events_quarantine
      checkpoint_dir: /tmp/checkpoints/silver_clickstream_user_events
      heartbeat_file: /tmp/health/silver_clickstream_user_events.json
      trigger_interval: 30 seconds

      field_map:
        event_id: $.event_id
        event_ts: $.event_ts
        event_type: $.event_type
        source: $.source
        user_id: $.user_id
        anonymous_id: $.anonymous_id
        session_id: $.session_id
        page_url: $.page_url
        item_id: $.properties.item_id
        item_title: $.properties.item_title
        backend_event_name: $.properties.backend_event_name
        message: $.properties.message
        search_query: $.properties.search_query
        results_count: $.properties.results_count

      required_fields:
        - event_type
        - event_date

      identity_keys:
        - event_id
        - user_id
        - anonymous_id
        - session_id

      computed_fields:
        event_date:
          kind: sql
          expr: "coalesce(to_date(event_ts), to_date(kafka_timestamp))"
        canonical_user_key:
          kind: sql
          expr: "coalesce(user_id, anonymous_id)"

      transform_plugin: spark_apps.transforms.clickstream:apply_clickstream_transform

    restart_policy:
      max_retries: 10
      backoff_seconds: 10